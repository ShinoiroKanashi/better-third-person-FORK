plugins {
    id "net.fabricmc.fabric-loom" version "1.17.20"
    id "maven-publish"
}

group = "io.socol"
version = "1.11.0-26.2-fork"

base {
    archivesName = "better-third-person"
}

repositories {
    maven { url = uri("https://maven.fabricmc.net/") }
    maven { url = uri("https://maven.terraformersmc.com/releases/") }
    maven { url = uri("https://maven.shedaniel.me/") }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.152.0+26.2"

    // Optional at runtime; the mod works without them.
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:26.2.155"
    compileOnly "com.terraformersmc:modmenu:20.0.2"
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

processResources {
    inputs.property("version", project.version)

    filesMatching("fabric.mod.json") {
        expand(version: project.version)
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

jar {
    from("LICENSE") {
        rename { "LICENSE_betterthirdperson" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
        // Add your publishing repository here if needed.
    }
}
