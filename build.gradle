plugins {
    id "fabric-loom" version "1.13.6"
    id "maven-publish"
}

group = "io.socol"
version = "1.10.0-1.21.11-fork"

base {
    archivesName = "better-third-person"
}

repositories {
    maven { url = uri("https://maven.fabricmc.net/") }
    maven { url = uri("https://maven.terraformersmc.com/releases/") }
    maven { url = uri("https://maven.shedaniel.me/") }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:0.18.4"
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11"

    // Optional at runtime; the mod works without them.
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:21.11.153"
    modCompileOnly "com.terraformersmc:modmenu:17.0.0"
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "betterthirdperson-refmap.json"
    }

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

processResources {
    inputs.property("version", project.version)

    filesMatching("fabric.mod.json") {
        expand(version: project.version)
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

jar {
    from("LICENSE") {
        rename { "LICENSE_betterthirdperson" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
        // Add your publishing repository here if needed.
    }
}
